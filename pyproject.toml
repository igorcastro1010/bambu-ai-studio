[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "bambu-ai-studio"
version = "0.2.0"
description = "Modelagem 3D local por codigo para Bambu Lab A1 Mini"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.5.4", "trimesh==5.1.1", "plotly==7.1.0", "scipy==1.18.1"]

[project.optional-dependencies]
cadquery = ["cadquery==2.8.0"]
build123d = ["build123d==0.13.0"]
dev = ["pytest==9.1.1"]

[project.scripts]
bambu-ai = "bambu_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
conflicts = [[{ extra = "cadquery" }, { extra = "build123d" }]]
